<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12707E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Рабочее место руководителя СИБ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F1F4F5;--card:#fff;--ink:#1B2A33;--mut:#5E727B;--line:#D3DDE1;--ac:#12707E;--ok:#2E7D4F;--wn:#B7791F;--bd:#B3362E;--nn:#6B7B83;--okb:#E3F2E9;--wnb:#FBF0D9;--bdb:#F8E1DE;--nnb:#E6EBED;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10191D;--card:#182429;--ink:#E3ECEF;--mut:#93A8B0;--line:#2C3F46;--ac:#3BB0C2;--ok:#5CC58A;--wn:#E0A840;--bd:#EE7D74;--nn:#93A8B0;--okb:#1B3326;--wnb:#3A2F17;--bdb:#3C1F1D;--nnb:#213038}}
:root[data-theme="dark"]{--bg:#10191D;--card:#182429;--ink:#E3ECEF;--mut:#93A8B0;--line:#2C3F46;--ac:#3BB0C2;--ok:#5CC58A;--wn:#E0A840;--bd:#EE7D74;--nn:#93A8B0;--okb:#1B3326;--wnb:#3A2F17;--bdb:#3C1F1D;--nnb:#213038}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:6}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700}
.save{margin-left:auto;font-size:12.5px;color:var(--mut)}
nav{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);padding:7px 14px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{background:var(--ac);color:#fff}
main{padding:16px;max-width:1200px;margin:0 auto}
button,input,select{font:inherit;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.big{font-size:34px;font-weight:700;line-height:1}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--nnb);margin:10px 0 6px}
.bar i{display:block}
ul.l{margin:8px 0 0;padding:0;list-style:none}
ul.l li{padding:5px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}
.tag{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--okb);color:var(--ok)}.t-wn{background:var(--wnb);color:var(--wn)}.t-bd{background:var(--bdb);color:var(--bd)}.t-nn{background:var(--nnb);color:var(--nn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th{text-align:left;font-size:13px;color:var(--mut);padding:8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:5px;padding:5px 6px}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--ac);background:var(--card)}
td select[data-v="Выполнено"],td select[data-v="Закрыт"]{background:var(--okb);color:var(--ok)}
td select[data-v="В работе"],td select[data-v="В обработке"]{background:var(--wnb);color:var(--wn)}
td select[data-v="Блокировано"],td select[data-v="Открыт"]{background:var(--bdb);color:var(--bd)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:18px;padding:2px 8px}.x:hover{color:var(--bd)}
.heat{display:grid;grid-template-columns:auto repeat(5,48px);gap:3px;align-items:center;font-size:12.5px;color:var(--mut)}
.heat b{display:flex;align-items:center;justify-content:center;height:40px;border-radius:5px;color:#fff;font-size:15px}
.note{color:var(--mut);font-size:13px;margin:10px 0 0}
@media (max-width:720px){
header{position:static;padding:10px 14px}
body::before{display:none}
h1{font-size:17px}
.save{margin-left:0;width:100%}
main{padding:12px 12px 96px}
nav{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px));z-index:7;overflow:visible}
nav button{flex:1;padding:10px 0;font-size:11.5px;text-align:center;border-radius:8px;min-height:44px}
.tools .btn{min-height:44px;flex:1}
.tw{border:0;background:none;overflow:visible}
table,thead,tbody,tr,td{display:block;min-width:0;width:100%}
thead{display:none}
tr{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px 6px;margin-bottom:10px}
td{display:flex;align-items:center;gap:8px;border:0;padding:3px 0}
td::before{content:attr(data-label);flex:0 0 38%;font-size:12.5px;color:var(--mut)}
td:first-child{flex-direction:column;align-items:stretch;gap:2px;padding-right:46px}
td:first-child::before{flex:none}
td input,td select{flex:1;min-width:0;border-color:var(--line);background:var(--card);padding:9px 8px;font-size:16px;min-height:44px}
td.xx{position:absolute;top:2px;right:2px;width:auto;padding:0}
td.xx::before{display:none}
.x{font-size:24px;padding:6px 14px;min-height:44px}
.card{padding:14px}
.big{font-size:38px}
.heat{grid-template-columns:auto repeat(5,minmax(0,1fr))}
}
@media print{header nav,.tools,.x,.save{display:none}body{background:#fff}}
</style>
</head>
<body>
<header>
<div class="top"><h1>Рабочее место руководителя СИБ</h1><span class="save" id="sv">Загрузка…</span></div>
<nav id="nav" role="tablist"></nav>
</header>
<main id="main"></main>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
(function(){
var ST=["Не начато","В работе","Выполнено","Блокировано"],SEV=["Низкая","Средняя","Высокая","Критичная"],IST=["Открыт","В обработке","Закрыт"],BR=["Правовая основа","Организационные","Технические","Мониторинг","Контроль"];
var TABS=[["ov","Обзор"],["m","Меры"],["r","Риски"],["k","Показатели"],["e","Инциденты"]];
var COLS={
m:[["t","Мера","text"],["b","Направление","sel",BR],["base","Нормативная основа","text"],["own","Ответственный","text"],["due","Срок","date"],["st","Статус","sel",ST]],
r:[["t","Риск","text"],["p","Вероятность (1–5)","sel",["1","2","3","4","5"]],["i","Ущерб (1–5)","sel",["1","2","3","4","5"]],["sc","Оценка","calc"],["mit","Что делаем","text"],["own","Ответственный","text"]],
k:[["t","Показатель","text"],["cur","Сейчас","number"],["tar","Цель","number"],["dir","Лучше","sel",["меньше","больше"]],["ks","Статус","calc"]],
e:[["d","Дата","date"],["t","Описание","text"],["sev","Критичность","sel",SEV],["own","Ответственный","text"],["st","Статус","sel",IST]]};
function M(t,b,base){return{t:t,b:b,base:base||"",own:"",due:"",st:"Не начато"}}
function seed(){return{
m:[M("Политика ИБ и регламенты","Организационные","Единые требования (пост. № 832)"),M("Обучение сотрудников основам кибербезопасности","Организационные","Закон «О кибербезопасности»"),M("План реагирования на инциденты","Организационные"),M("Система управления ИБ (СТ РК ISO/IEC 27001)","Организационные"),M("Защита сети и периметра, сегментация","Технические"),M("Защита конечных точек","Технические"),M("Управление доступом, MFA","Технические"),M("Шифрование и резервное копирование","Технические","Единые требования (пост. № 832)"),M("Оперативный центр ИБ: свой или услуга","Мониторинг","Единые требования (пост. № 832)"),M("Взаимодействие с НКЦИБ, уведомление об инцидентах","Мониторинг"),M("Сканирование уязвимостей и управление обновлениями","Технические"),M("Контроль подрядчиков","Организационные"),M("Ежегодная проверка защищённости систем","Контроль","Закон «О кибербезопасности»"),M("Испытания на соответствие требованиям ИБ","Контроль"),M("Внутренний аудит и тесты на проникновение","Контроль")],
r:[["Фишинг и социальная инженерия"],["Утечка персональных данных"],["Незакрытые критичные уязвимости"],["Недоступность ключевых сервисов"],["Риски подрядчиков"]].map(function(a){return{t:a[0],p:"3",i:"3",mit:"",own:""}}),
k:[["Инциденты ИБ за период","меньше"],["Критичные уязвимости, шт.","меньше"],["Время реагирования, часов","меньше"],["Доля обученных сотрудников, %","больше"],["Замечания аудитов, шт.","меньше"]].map(function(a){return{t:a[0],cur:"",tar:"",dir:a[1]}}),
e:[]}}
var S=seed(),tab="ov",db=null,doc=null,timer=null,main=document.getElementById("main");
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sc(r){return (+r.p)*(+r.i)}
function lvl(s){return s>=12?["Высокий","bd"]:s>=6?["Средний","wn"]:["Низкий","ok"]}
function kst(k){if(k.cur===""||k.tar==="")return["Нет данных","nn"];var c=+k.cur,t=+k.tar;return(k.dir==="меньше"?c<=t:c>=t)?["В цели","ok"]:["Вне цели","bd"]}
function status(m){return m==="saved"?"Сохранено":m==="saving"?"Сохранение…":m}
function setSv(t){document.getElementById("sv").textContent=t}
function save(){setSv("Сохранение…");clearTimeout(timer);timer=setTimeout(function(){
 var j=JSON.stringify(S);
 if(doc){doc.set({json:j}).then(function(){setSv("Сохранено. Данные видны только вам")}).catch(function(){setSv("Не удалось сохранить")})}
 else{try{localStorage.setItem("sib-ws-v1",j);setSv("Сохранено в этом браузере")}catch(e){setSv("Хранилище недоступно")}}},500)}
function load(){
 var finish=function(j){try{if(j){var o=JSON.parse(j);["m","r","k","e"].forEach(function(x){if(Array.isArray(o[x]))S[x]=o[x]})}}catch(e){}render();setSv(doc?"Данные видны только вам":"Данные хранятся в этом браузере")};
 var ls=function(){var j=null;try{j=localStorage.getItem("sib-ws-v1")}catch(e){}finish(j)};
 if(window.claude&&claude.use){
  claude.use("db").then(function(d){db=d;if(!d)return ls();return claude.use("user").then(function(u){if(!u||!u.id)return ls();return u.id().then(function(id){doc=db.doc("data/users/"+id+"/state");return doc.get().then(function(s){finish(s.exists?s.data().json:null)})})})}).catch(function(){doc=null;ls()});
 }else ls()}
function pct(n,t){return t?Math.round(n/t*100):0}
function overview(){
 var m=S.m,t=m.length,cnt={};ST.forEach(function(s){cnt[s]=m.filter(function(x){return x.st===s}).length});
 var od=m.filter(function(x){return x.due&&x.due<today()&&x.st!=="Выполнено"});
 var hr=S.r.slice().sort(function(a,b){return sc(b)-sc(a)}),hi=hr.filter(function(r){return sc(r)>=12});
 var ko=S.k.filter(function(k){return kst(k)[1]==="bd"}),op=S.e.filter(function(e){return e.st!=="Закрыт"});
 var col={"Выполнено":"var(--ok)","В работе":"var(--wn)","Блокировано":"var(--bd)","Не начато":"var(--nn)"};
 var h='<div class="grid">';
 h+='<div class="card"><h3>Выполнение мер защиты</h3><div class="big">'+pct(cnt["Выполнено"],t)+'%</div><div class="bar">'+ST.map(function(s){return'<i style="width:'+pct(cnt[s],t)+'%;background:'+col[s]+'"></i>'}).join("")+'</div><div class="sub">'+ST.map(function(s){return s+": "+cnt[s]}).join(", ")+'</div></div>';
 h+='<div class="card"><h3>Просрочено</h3><div class="big" style="color:var(--'+(od.length?"bd":"ok")+')">'+od.length+'</div><ul class="l">'+od.slice(0,5).map(function(x){return'<li><span>'+esc(x.t)+'</span><span class="sub">'+esc(x.due)+'</span></li>'}).join("")+'</ul>'+(od.length?"":'<div class="sub">Просроченных мер нет</div>')+'</div>';
 h+='<div class="card"><h3>Высокие риски</h3><div class="big" style="color:var(--'+(hi.length?"bd":"ok")+')">'+hi.length+'</div><ul class="l">'+hr.slice(0,5).map(function(r){var l=lvl(sc(r));return'<li><span>'+esc(r.t)+'</span><span class="tag t-'+l[1]+'">'+sc(r)+"</span></li>"}).join("")+'</ul></div>';
 h+='<div class="card"><h3>Показатели вне цели</h3><div class="big" style="color:var(--'+(ko.length?"bd":"ok")+')">'+ko.length+'</div><ul class="l">'+S.k.slice(0,6).map(function(k){var s=kst(k);return'<li><span>'+esc(k.t)+'</span><span class="tag t-'+s[1]+'">'+s[0]+"</span></li>"}).join("")+'</ul></div>';
 h+='<div class="card"><h3>Открытые инциденты</h3><div class="big">'+op.length+'</div><ul class="l">'+op.slice(0,5).map(function(e){return'<li><span>'+esc(e.t||"Без описания")+'</span><span class="sub">'+esc(e.sev)+'</span></li>'}).join("")+'</ul>'+(op.length?"":'<div class="sub">Открытых инцидентов нет</div>')+'</div>';
 return h+'</div><div class="tools" style="margin-top:12px"><button class="btn" data-exp="1">Сохранить копию</button><button class="btn" data-imp="1">Загрузить копию</button></div><p class="note">Копия нужна для переноса данных на другое устройство. Обзор считается по данным вкладок. Оценки рисков и показатели заполнены шаблонно: внесите реальные значения.</p>'}
function table(k){
 var cols=COLS[k],h='<div class="tools"><button class="btn p" data-add="'+k+'">Добавить строку</button><button class="btn" data-print="1">Печать</button></div>';
 if(k==="r")h+='<div class="card" style="margin-bottom:12px"><h3>Матрица рисков</h3><div id="heat"></div></div>';
 h+='<div class="tw"><table><thead><tr>'+cols.map(function(c){return"<th>"+c[1]+"</th>"}).join("")+"<th></th></tr></thead><tbody>";
 S[k].forEach(function(row,i){h+="<tr>"+cols.map(function(c){
  var v=row[c[0]];
  if(c[2]==="calc")return'<td data-label="'+c[1]+'" data-calc="'+c[0]+'" data-i="'+i+'"></td>';
  if(c[2]==="sel")return'<td data-label="'+c[1]+'"><select data-k="'+k+'" data-i="'+i+'" data-f="'+c[0]+'" data-v="'+esc(v)+'">'+c[3].map(function(o){return"<option"+(o===v?" selected":"")+">"+o+"</option>"}).join("")+"</select></td>";
  return'<td data-label="'+c[1]+'"><input type="'+(c[2]==="number"?"number":c[2])+'"'+(c[2]==="number"?' step="any"':"")+' data-k="'+k+'" data-i="'+i+'" data-f="'+c[0]+'" value="'+esc(v)+'"></td>'}).join("")+'<td class="xx"><button class="x" data-del="'+k+':'+i+'" aria-label="Удалить строку">×</button></td></tr>'});
 h+="</tbody></table></div>";
 if(!S[k].length)h+='<p class="note">Пока пусто. Нажмите «Добавить строку».</p>';
 return h}
function calc(){
 [].forEach.call(main.querySelectorAll("[data-calc]"),function(td){
  var i=+td.dataset.i,f=td.dataset.calc;
  if(f==="sc"){var s=sc(S.r[i]),l=lvl(s);td.innerHTML='<span class="tag t-'+l[1]+'">'+s+" · "+l[0]+"</span>"}
  else{var s2=kst(S.k[i]);td.innerHTML='<span class="tag t-'+s2[1]+'">'+s2[0]+"</span>"}});
 var hm=document.getElementById("heat");if(!hm)return;
 var h='';for(var p=5;p>=1;p--){h+='<span>'+p+'</span>';for(var q=1;q<=5;q++){var n=S.r.filter(function(r){return +r.p===p&&+r.i===q}).length,l=lvl(p*q);h+='<b style="background:var(--'+l[1]+');opacity:'+(n?1:.28)+'">'+(n||"")+"</b>"}}
 h+="<span></span>";for(q=1;q<=5;q++)h+="<span style='text-align:center'>"+q+"</span>";
 hm.className="heat";hm.innerHTML=h;
 hm.insertAdjacentHTML("afterend",'<div class="sub">По вертикали вероятность, по горизонтали ущерб. В клетках число рисков.</div>');
 var ex=hm.parentNode.querySelectorAll(".sub");if(ex.length>1)ex[0].remove()}
function render(){
 document.getElementById("nav").innerHTML=TABS.map(function(t){return'<button role="tab" aria-selected="'+(t[0]===tab)+'" data-tab="'+t[0]+'">'+t[1]+"</button>"}).join("");
 main.innerHTML=tab==="ov"?overview():table(tab);if(tab!=="ov")calc()}
document.addEventListener("click",function(e){
 var t=e.target.closest("button");if(!t)return;
 if(t.dataset.tab){tab=t.dataset.tab;render()}
 else if(t.dataset.add){var k=t.dataset.add;S[k].push(k==="m"?M("Новая мера","Организационные"):k==="r"?{t:"Новый риск",p:"3",i:"3",mit:"",own:""}:k==="k"?{t:"Новый показатель",cur:"",tar:"",dir:"меньше"}:{d:today(),t:"",sev:"Средняя",own:"",st:"Открыт"});save();render()}
 else if(t.dataset.del){var a=t.dataset.del.split(":");S[a[0]].splice(+a[1],1);save();render()}
 else if(t.dataset.print){window.print()}
 else if(t.dataset.exp){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sib-data-"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
 else if(t.dataset.imp){document.getElementById("imp").click()}});
document.getElementById("imp").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);["m","r","k","e"].forEach(function(x){if(Array.isArray(o[x]))S[x]=o[x]});save();render();setSv("Копия загружена")}catch(er){setSv("Файл не подошёл")}e.target.value=""};r.readAsText(f)});
main.addEventListener("change",function(e){var el=e.target;if(!el.dataset.k)return;
 S[el.dataset.k][+el.dataset.i][el.dataset.f]=el.value;if(el.tagName==="SELECT")el.dataset.v=el.value;calc();save()});
render();load();
})();
</script>
</body>
</html>
